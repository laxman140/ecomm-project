<!-- @if (images) { -->
<ngb-carousel *ngIf="popularProducts.length">
	<ng-template ngbSlide *ngFor="let product of popularProducts">
		<div class="picsum-img-wrapper">
			<a routerLink="/details/{{product.id}}"><img class="product-header-img" [src]="product.image"
					alt="Random first slide" /></a>
		</div>
		<div class="carousel-caption">
			<h3>{{ product.name }}</h3>
			<p>{{ product.description }}</p>
		</div>
	</ng-template>
</ngb-carousel>
<!-- } -->
<div class="product-list-wrapper">
	<h1>Trendy Products</h1>
	<div class="row">
		<div class="col-sm-3" *ngFor="let trendyProduct of trendyProducts">
			<div class="product-item">
				<img src="{{ trendyProduct.image }}" alt="Product 1" />
				<div class="product-details">
					<div class="product-name ">
						<h3>{{ trendyProduct.name }}</h3>
					</div>
					<div class="product-price ">
						<p>Price: {{ trendyProduct.price }}</p>
					</div>
					<div class="product-description ">
						<p>Description: {{ trendyProduct.description }}</p>
					</div>
				</div>
				<div class="product-footer">
					 <a routerLink ="/details/{{trendyProduct.id}}">View Details</a>
					<a href="#">Add to Cart</a>
				</div>
			</div>
		</div>
	</div>
</div>
