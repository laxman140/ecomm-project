<div class="checkout">
    <h1>Checkout Page</h1>
    <p class="message-p">{{orderMsg}}</p>
    <div class="row">
        <div class="col-sm-7">
            <h3>Add Shipping Address</h3>
            <form #orderDetails="ngForm" class="common-form" (ngSubmit)="orderNow(orderDetails.value)">
                <input type="text" name="email" ngModel class="form-input" placeholder="Enter your email" />
                <input type="text" name="address" ngModel class="form-input" placeholder="Enter your Address details" />
                <input type="text" name="contact" ngModel class="form-input" placeholder="Enter your contact details" />
                <button class="form-button">Order Now</button>
            </form>
        </div>
        <div class="col-sm-5">
            <h3>Total Amount: {{totalPrice}}</h3>
            <h4>Payment Method: <b>Cash On Delivery</b></h4>
        </div>
    </div>
</div>
